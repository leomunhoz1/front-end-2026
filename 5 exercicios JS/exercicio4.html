<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Infinity Bank</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:50px;
}
input, select, button{
    padding:10px;
    margin:5px;
}
</style>
</head>
<body>

<h2>Infinity Bank</h2>

<select id="bandeira">
    <option value="visa">Visa</option>
    <option value="master">Master</option>
    <option value="elo">Elo</option>
</select>

<input type="number" id="valor" placeholder="Valor da venda">
<input type="number" id="parcelas" placeholder="Parcelas">

<button onclick="calcular()">Calcular</button>

<h3 id="resultado"></h3>

<script>
function calcular(){

    let bandeira = document.getElementById("bandeira").value;
    let valor = Number(document.getElementById("valor").value);
    let parcelas = Number(document.getElementById("parcelas").value);

    let taxa = 0;

    switch(bandeira){
        case "visa":
            taxa = valor * 0.02;
            break;

        case "master":
            taxa = valor * 0.0185;
            break;

        case "elo":
            taxa = valor * 0.03;
            break;
    }

    let juros = valor * (0.0035 * parcelas);

    let taxaMensal = 12.50 * parcelas;

    let total = valor + taxa + juros + taxaMensal;

    let valorParcela = total / parcelas;

    document.getElementById("resultado").innerHTML =
    "Taxa: R$ " + taxa.toFixed(2) +
    "<br>Juros: R$ " + juros.toFixed(2) +
    "<br>Parcelas: R$ " + valorParcela.toFixed(2);
}
</script>

</body>
</html>
