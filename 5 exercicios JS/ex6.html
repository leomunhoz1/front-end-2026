<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Eventos Infinity</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:50px;
}

select,
input,
button{
    padding:10px;
    margin:5px;
}

#resultado{
    margin-top:20px;
    font-size:18px;
}
</style>

</head>
<body>

<h2>Orçamento de Eventos</h2>

<select id="pacote">
    <option value="50">Standard</option>
    <option value="80">Premium</option>
    <option value="120">Infinity Deluxe</option>
</select>

<input type="number" id="pessoas" placeholder="Quantidade de Pessoas">

<button onclick="calcular()">Calcular Orçamento</button>

<div id="resultado"></div>

<script>
function calcular(){

    let pacote = Number(document.getElementById("pacote").value);

    let pessoas = Number(document.getElementById("pessoas").value);

    let bruto = pacote * pessoas;

    let taxa = bruto * 0.10;

    let total = bruto + taxa;

    let desconto = 0;

    if(pessoas > 100){

        desconto = total * 0.05;

        total -= desconto;
    }

    document.getElementById("resultado").innerHTML =
    "Custo Bruto: R$ " + bruto.toFixed(2) +
    "<br>Taxa de Serviço: R$ " + taxa.toFixed(2) +
    "<br>Desconto: R$ " + desconto.toFixed(2) +
    "<br>Total Final: R$ " + total.toFixed(2);
}
</script>

</body>
</html>
