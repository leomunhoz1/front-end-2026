<!DOCTYPE html>
<head>
<title>Conversor</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:50px;
}
input{
    padding:10px;
    margin:10px;
}
</style>
</head>
<body>

<h2>Conversor de Temperatura</h2>

<input type="number" id="celsius" placeholder="Celsius" step="0.1">
<input type="number" id="fahrenheit" placeholder="Fahrenheit" step="0.1">

<script>
let celsius = document.getElementById("celsius");
let fahrenheit = document.getElementById("fahrenheit");

celsius.addEventListener("input", function(){
    let c = Number(celsius.value);
    let f = (c * 9/5) + 32;
    fahrenheit.value = f.toFixed(2);
});

fahrenheit.addEventListener("input", function(){
    let f = Number(fahrenheit.value);
    let c = (f - 32) * 5/9;
    celsius.value = c.toFixed(2);
});
</script>

</body>
</html>
